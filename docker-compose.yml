services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: drassos
      POSTGRES_PASSWORD: drassos
      POSTGRES_DB: drassos
    ports:
      - "5432:5432"
    volumes:
      - drassos-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drassos -d drassos"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  drassos-pg:
